# Project-wide Gradle settings. Do NOT put API keys or secrets here unless they
# are meant to be injected by CI (secrets must be injected as environment
# variables or via `local.properties`, which is gitignored).

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
android.enableResourceOptimizations=true

# Suppresses noisy third-party lint checks in environments without the Android
# SDK (e.g. this sandbox). Has no effect on real builds.
android.lintIgnoreWarnings=true
