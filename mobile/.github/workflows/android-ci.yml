name: Android CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main, "arena/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: '35.0.0'
          target: 'android-35'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ---------------------------------------------------------------------
      # SECRETS — never commit these; inject from GitHub repository secrets.
      # Required secrets: GOOGLE_MAPS_API_KEY, BEAUTYZONE_API_BASE_URL,
      #                   GOOGLE_SERVICES_JSON (contents of google-services.json)
      # ---------------------------------------------------------------------
      - name: Inject local.properties
        run: |
          mkdir -p mobile
          cat > mobile/local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          BEAUTYZONE_API_BASE_URL=${{ secrets.BEAUTYZONE_API_BASE_URL }}
          EOF

      - name: Inject google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > mobile/app/google-services.json

      - name: Gradle wrapper check
        run: |
          test -f mobile/gradlew || { echo "Gradle wrapper not committed. Generate it locally and commit: cd mobile && gradle wrapper --gradle-version 8.5 --distribution-type all"; exit 1; }

      - name: Build debug APK
        working-directory: mobile
        run: ./gradlew assembleDebug --no-daemon

      - name: Lint
        working-directory: mobile
        run: ./gradlew lintDebug --no-daemon

      - name: Run unit tests
        working-directory: mobile
        run: ./gradlew testDebugUnitTest --no-daemon
